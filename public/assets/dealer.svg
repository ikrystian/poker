<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-label="Pani krupier">
  <title>Pani krupier</title>

  <defs>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243330"/>
      <stop offset="1" stop-color="#0d1614"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3d2b23"/>
      <stop offset="0.55" stop-color="#241812"/>
      <stop offset="1" stop-color="#150d0a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.25" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0cba6"/>
      <stop offset="1" stop-color="#dca87e"/>
